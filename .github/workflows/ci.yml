name: Build and binary compatibility

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: Test the ABI artifact checker
        run: python3 -m unittest discover -s tools -p test_check_api_abi.py -v
      - name: Build and test both artifacts
        run: |
          chmod +x gradlew
          ./gradlew :core:test :core:jar :api:assembleRelease :api:lintRelease :api:assembleDebugAndroidTest :core:generatePomFileForCorePublication :api:generatePomFileForReleasePublication
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .abi-baseline
      - name: Build unchanged base API
        if: github.event_name == 'pull_request'
        run: |
          chmod +x .abi-baseline/gradlew
          .abi-baseline/gradlew -p .abi-baseline :api:assembleRelease
      - name: Compare installed-extension JVM contract
        if: github.event_name == 'pull_request'
        run: |
          baseline_artifacts=(.abi-baseline/api/build/outputs/aar/api-release.aar)
          for core_jar in .abi-baseline/core/build/libs/extensions-core-*-SNAPSHOT.jar; do
            if [ -f "$core_jar" ]; then baseline_artifacts+=("$core_jar"); fi
          done
          python3 tools/check_api_abi.py \
            --baseline "${baseline_artifacts[@]}" \
            --current api/build/outputs/aar/api-release.aar core/build/libs/extensions-core-*-SNAPSHOT.jar \
            --core core/build/libs/extensions-core-*-SNAPSHOT.jar \
            --android-pom api/build/publications/release/pom-default.xml \
            --core-pom core/build/publications/core/pom-default.xml

      - name: Upload production-provider instrumentation APK
        uses: actions/upload-artifact@v4
        with:
          name: api-android-test
          path: api/build/outputs/apk/androidTest/debug/api-debug-androidTest.apk
          if-no-files-found: error

  android-browser:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: actions/download-artifact@v4
        with:
          name: api-android-test
          path: build/android-test
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash .github/scripts/android-browser-test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-android-browser-result
          path: build/android-test/result.log
          if-no-files-found: ignore
