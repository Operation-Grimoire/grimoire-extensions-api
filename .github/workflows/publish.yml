name: Publish to GitHub Packages

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release version to cut, e.g. v0.2.0 — creates & pushes the tag, then publishes. Leave blank to publish a -SNAPSHOT.'
        required: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create & push the release tag
      packages: write   # publish to GitHub Packages

    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        id: rel
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="${{ github.event.inputs.tag }}"
          fi
          if [ -n "$TAG" ] && ! echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Version '$TAG' is not vX.Y.Z" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Grant gradlew permission
        run: chmod +x gradlew

      - name: Check shared runtime and Android wrapper
        run: ./gradlew :core:test :api:assembleRelease :api:lintRelease

      # Validate before creating a release tag. Existing tags must name this checkout.
      - name: Create release tag
        if: github.event_name == 'workflow_dispatch' && steps.rel.outputs.tag != ''
        env:
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            git fetch origin "refs/tags/$TAG:refs/tags/$TAG"
            if [ "$(git rev-list -n 1 "$TAG")" != "$(git rev-parse HEAD)" ]; then
              echo "Tag $TAG does not name the tested checkout; refusing to publish."
              exit 1
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG" "${{ github.sha }}"
            git push origin "refs/tags/$TAG"
          fi

      # Publish the dependency before the Android wrapper which re-exports it.
      - name: Publish portable core to GitHub Packages
        run: ./gradlew :core:publishCorePublicationToGitHubPackagesRepository
        env:
          API_RELEASE_TAG: ${{ steps.rel.outputs.tag }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Empty API_RELEASE_TAG -> build.gradle.kts falls back to <next>-SNAPSHOT.
      - name: Publish to GitHub Packages
        run: ./gradlew :api:publishReleasePublicationToGitHubPackagesRepository
        env:
          API_RELEASE_TAG: ${{ steps.rel.outputs.tag }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
